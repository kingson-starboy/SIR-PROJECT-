<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="iGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="rGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Background Orbit Path -->
  <circle cx="256" cy="256" r="145" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4" stroke-dasharray="8 8" />

  <!-- Directional Pulse Arcs connecting S -> I -> R -->
  <!-- S to I arc (Top-Left to Top-Right) -->
  <path d="M 175 160 A 145 145 0 0 1 337 160" fill="none" stroke="#F87171" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 8" opacity="0.85" />
  
  <!-- I to R arc (Top-Right to Bottom-Center) -->
  <path d="M 360 215 A 145 145 0 0 1 270 395" fill="none" stroke="#34D399" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 8" opacity="0.85" />

  <!-- Node S: Susceptible (Left Top) -->
  <g filter="url(#glow)">
    <circle cx="155" cy="170" r="44" fill="url(#sGrad)" />
    <circle cx="155" cy="170" r="44" fill="none" stroke="#BAE6FD" stroke-width="3" />
    <text x="155" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">S</text>
  </g>

  <!-- Node I: Infected (Right Top) -->
  <g filter="url(#glow)">
    <circle cx="357" cy="170" r="44" fill="url(#iGrad)" />
    <circle cx="357" cy="170" r="44" fill="none" stroke="#FECACA" stroke-width="3" />
    <text x="357" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">I</text>
  </g>

  <!-- Node R: Recovered (Bottom Center) -->
  <g filter="url(#glow)">
    <circle cx="256" cy="355" r="44" fill="url(#rGrad)" />
    <circle cx="256" cy="355" r="44" fill="none" stroke="#A7F3D0" stroke-width="3" />
    <text x="256" y="367" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">R</text>
  </g>

  <!-- Central Scientific Indicator Wave / Core -->
  <path d="M 215 256 Q 235 210, 256 256 T 297 256" fill="none" stroke="url(#borderGrad)" stroke-width="7" stroke-linecap="round" />

  <!-- Core Brand Text: SIR -->
  <text x="256" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="4" fill="#94A3B8" text-anchor="middle" opacity="0.65">MODEL</text>
</svg>
